name: "Upgrade iterm2_color_schemes_dart"

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  BASE_BRANCH: main
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ env.BASE_BRANCH }}

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Upgrade themes
      id: upgrade
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        chmod +x ./scripts/upgrade-next-minor ./scripts/next-minor-version ./scripts/upgrade
        ./scripts/upgrade-next-minor
        if git diff --quiet -- \
          lib/src/iterm2_color_schemes.g.dart \
          lib/src/iterm2_color_schemes_values.g.dart
        then
          echo "No theme changes found. Exiting without publishing."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
        git add -A
        git diff --cached --quiet && {
          echo "No staged changes found."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        }
        git commit -m "chore: upgrade iTerm2 themes to $VERSION"
        git tag "v$VERSION"
        git push origin "${{ env.BASE_BRANCH }}"
        git push origin "v$VERSION"

        gh release create "v$VERSION" \
          --title "v$VERSION" \
          --generate-notes

        gh workflow run pub-publish.yml --ref "v$VERSION"

        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
